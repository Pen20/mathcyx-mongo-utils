[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mathcyx-mongo-utils"
version = "0.1.0"
description = "Small, typed MongoDB connection and CRUD utilities for Python projects."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Motognon Wastalas d'Assise Dogbalou", email = "wastalasdassise@gmail.com" }]
keywords = ["mongodb", "pymongo", "database", "mathcyx"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = ["pymongo>=4.6,<5"]

[project.optional-dependencies]
data = ["pandas>=2.0", "openpyxl>=3.1"]
dev = ["build>=1.2", "mypy>=1.10", "pytest>=8.0", "ruff>=0.7", "twine>=5.0"]

[project.urls]
Homepage = "https://github.com/Pen20/mathcyx-mongo-utils"
Repository = "https://github.com/Pen20/mathcyx-mongo-utils"
Issues = "https://github.com/Pen20/mathcyx-mongo-utils/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["experiments", "template.py"]

[tool.ruff.lint]
ignore = ["PYI034"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["mathcyx_mongo_utils", "mongodb_connect"]
explicit_package_bases = true
